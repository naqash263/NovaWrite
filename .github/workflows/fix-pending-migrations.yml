name: Fix Pending Migrations

on:
  workflow_dispatch:

jobs:
  fix-migrations:
    runs-on: ubuntu-latest

    steps:
    - name: Fix Pending Migrations
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        port: 21098
        timeout: 300s
        command_timeout: 300s
        script: |
          # Colors for output
          RED='\033[0;31m'
          GREEN='\033[0;32m'
          BLUE='\033[0;34m'
          YELLOW='\033[1;33m'
          NC='\033[0m' # No Color

          echo -e "${BLUE}🔧 Fixing Pending Migrations${NC}"
          echo "====================================="

          # Navigate to project directory
          cd ~/naqashthaheem.com/backend

          # Load environment variables
          if [ -f ".env" ]; then
            export $(grep -v '^#' .env | xargs)
          fi

          echo -e "${YELLOW}📋 Checking current migration status...${NC}"
          php artisan migrate:status

          echo -e "${YELLOW}🔧 Manually marking problematic migration as completed...${NC}"
          PGPASSWORD='mg08.Rcrld}N' psql -h localhost -U timesovh_naqash_thaheem -d timesovh_naqashthaheem -c "
            INSERT INTO migrations (migration, batch) 
            VALUES ('2025_10_24_132508_add_password_reset_columns_to_users_table', 18)
            WHERE NOT EXISTS (SELECT 1 FROM migrations WHERE migration = '2025_10_24_132508_add_password_reset_columns_to_users_table');
          "

          echo -e "${YELLOW}🗄️ Running remaining migrations...${NC}"
          php artisan migrate --force

          echo -e "${YELLOW}📊 Final migration status...${NC}"
          php artisan migrate:status

          echo -e "${GREEN}✅ Migration fix completed!${NC}"
