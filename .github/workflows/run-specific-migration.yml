name: Run Specific Migration

on:
  workflow_dispatch:

jobs:
  run-specific-migration:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Specific Migration
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        port: 21098
        timeout: 300s
        command_timeout: 300s
        script: |
          # Colors for output
          RED='\033[0;31m'
          GREEN='\033[0;32m'
          YELLOW='\033[1;33m'
          BLUE='\033[0;34m'
          NC='\033[0m' # No Color
          
          echo -e "${BLUE}🔧 Running Specific Migration${NC}"
          echo "=============================================="
          
          # Navigate to project directory
          cd ~/naqashthaheem.com/backend
          
          # Load environment variables
          if [ -f ".env" ]; then
            export $(grep -v '^#' .env | xargs)
          fi
          
          echo -e "${BLUE}🔍 Checking current migration status...${NC}"
          php artisan migrate:status | grep -E "(2025_10_24|2025_10_25)"
          
          echo -e "${BLUE}🔧 Manually inserting migration records...${NC}"
          
          # Insert the password reset migration record
          PGPASSWORD='mg08.Rcrld}N' psql -h localhost -U timesovh_naqash_thaheem -d timesovh_naqashthaheem -c "
            INSERT INTO migrations (migration, batch) 
            VALUES ('2025_10_24_132508_add_password_reset_columns_to_users_table', 18)
            WHERE NOT EXISTS (SELECT 1 FROM migrations WHERE migration = '2025_10_24_132508_add_password_reset_columns_to_users_table');
          "
          
          echo -e "${GREEN}✅ Password reset migration record inserted${NC}"
          
          echo -e "${BLUE}🗄️ Running system email settings migration...${NC}"
          php artisan migrate --path=database/migrations/2025_10_24_185409_create_system_email_settings_table.php --force
          
          echo -e "${BLUE}🔍 Checking final migration status...${NC}"
          php artisan migrate:status | grep -E "(2025_10_24|2025_10_25)"
          
          echo -e "${GREEN}✅ Specific migration completed${NC}"
