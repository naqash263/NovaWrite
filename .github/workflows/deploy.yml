name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Build frontend
      run: |
        cd frontend
        export VITE_API_URL=https://naqashthaheem.com/api
        export VITE_APP_NAME="Naqash Thaheem"
        export VITE_APP_ENV=production
        # Use production environment file if it exists
        if [ -f ".env.production" ]; then
          cp .env.production .env
        fi
        npm run build
        
    - name: Upload deployment script
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        port: 21098
        source: "scripts/deploy-production.sh"
        target: "/tmp"
    
    - name: Deploy to server
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        port: 21098
        timeout: 600s
        command_timeout: 600s
        script: |
          # Export environment variables
          export STABLE_APP_KEY="${{ secrets.STABLE_APP_KEY }}"
          export VAPID_PUBLIC_KEY="${{ secrets.VAPID_PUBLIC_KEY }}"
          export VAPID_PRIVATE_KEY="${{ secrets.VAPID_PRIVATE_KEY }}"
          export VAPID_SUBJECT="${{ secrets.VAPID_SUBJECT }}"
          export VITE_VAPID_PUBLIC_KEY="${{ secrets.VAPID_PUBLIC_KEY }}"
          
          # Make script executable and run it
          chmod +x /tmp/deploy-production.sh
          bash /tmp/deploy-production.sh
