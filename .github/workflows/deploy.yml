name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Build frontend
      run: |
        cd frontend
        export VITE_API_URL=https://naqashthaheem.com/api
        export VITE_APP_NAME="Naqash Thaheem"
        export VITE_APP_ENV=production
        # Use production environment file if it exists
        if [ -f ".env.production" ]; then
          cp .env.production .env
        fi
        npm run build
        
    - name: Deploy to server
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        port: 21098
        timeout: 300s
        command_timeout: 300s
        script: |
          # Colors for output
          RED='\033[0;31m'
          GREEN='\033[0;32m'
          YELLOW='\033[1;33m'
          BLUE='\033[0;34m'
          NC='\033[0m' # No Color
          
          echo -e "${BLUE}🚀 Starting Production Deployment${NC}"
          echo "=================================="
          
          # Create main directory structure
          mkdir -p ~/naqashthaheem.com
          cd ~/naqashthaheem.com
          
          # Clone or update repository
          if [ ! -d ".git" ]; then
            echo -e "${GREEN}📥 Cloning repository...${NC}"
            git clone https://github.com/naqash263/NovaWrite.git .
          else
            echo -e "${GREEN}🔄 Updating repository...${NC}"
            git fetch --all
            git reset --hard origin/main
          fi
          
          # Install Node.js using NVM (no sudo required)
          if ! command -v node &> /dev/null; then
            echo -e "${YELLOW}📦 Installing Node.js via NVM...${NC}"
            curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.0/install.sh | bash
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm install 20
            nvm use 20
            nvm alias default 20
          else
            echo -e "${GREEN}✅ Node.js already installed: $(node --version)${NC}"
            # Check if we need to upgrade to Node 20
            NODE_VERSION=$(node --version | cut -d'v' -f2 | cut -d'.' -f1)
            if [ "$NODE_VERSION" -lt 20 ]; then
              echo -e "${YELLOW}⚠️ Upgrading to Node.js 20 (current: $(node --version))${NC}"
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              nvm install 20
              nvm use 20
              nvm alias default 20
            fi
          fi
          
          # Ensure Node.js is available in current session
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          export PATH="$NVM_DIR/versions/node/$(nvm current)/bin:$PATH"
          
          # Fix npm configuration issues
          echo -e "${BLUE}🔧 Fixing npm configuration...${NC}"
          if [ -f "$HOME/.npmrc" ]; then
            echo -e "${YELLOW}⚠️ Removing conflicting .npmrc file${NC}"
            rm -f "$HOME/.npmrc"
          fi
          
          # Clean npm cache
          npm cache clean --force
          
          # Install frontend dependencies
          echo -e "${BLUE}📦 Installing frontend dependencies...${NC}"
          cd frontend
          
          # Verify Node.js is working
          if ! command -v node &> /dev/null; then
            echo -e "${RED}❌ Node.js not found after installation${NC}"
            exit 1
          fi
          
          echo -e "${GREEN}✅ Node.js version: $(node --version)${NC}"
          echo -e "${GREEN}✅ NPM version: $(npm --version)${NC}"
          
          # Clean install
          echo -e "${BLUE}🧹 Cleaning previous installation...${NC}"
          rm -rf node_modules package-lock.json
          
          npm install
          
          # Create production environment file
          echo -e "${BLUE}📝 Creating production environment file...${NC}"
          echo "VITE_API_URL=https://naqashthaheem.com/api" > .env
          echo "VITE_APP_NAME=Naqash Thaheem" >> .env
          echo "VITE_APP_ENV=production" >> .env
          
          # Build frontend
          echo -e "${BLUE}🔨 Building frontend...${NC}"
          export VITE_API_URL=https://naqashthaheem.com/api
          export VITE_APP_NAME="Naqash Thaheem"
          export VITE_APP_ENV=production
          
          npm run build
          
          # Verify build was successful
          if [ ! -d "dist" ]; then
            echo -e "${RED}❌ Frontend build failed - dist directory not found${NC}"
            exit 1
          fi
          
          echo -e "${GREEN}✅ Frontend build completed successfully${NC}"
          
          # Install backend dependencies
          echo -e "${BLUE}📦 Installing backend dependencies...${NC}"
          cd ../backend
          
          # Install Composer dependencies
          if ! command -v composer &> /dev/null; then
            echo -e "${YELLOW}📦 Installing Composer...${NC}"
            curl -sS https://getcomposer.org/installer | php
            mv composer.phar ~/composer
            chmod +x ~/composer
            export PATH="$HOME:$PATH"
          fi
          
          # Ensure Composer is available
          export PATH="$HOME:$PATH"
          
          composer install --no-dev --optimize-autoloader
          
          # Set up Laravel
          echo -e "${BLUE}⚙️ Setting up Laravel...${NC}"
          
          # Create .env file for Laravel
          if [ -f ".env.production" ]; then
            echo -e "${GREEN}✅ Using production environment file${NC}"
            cp .env.production .env
          else
            echo -e "${YELLOW}⚠️ Creating .env file from example${NC}"
            cp .env.example .env
            # Update database configuration for production
            sed -i 's/DB_CONNECTION=sqlite/DB_CONNECTION=pgsql/' .env
            sed -i 's/DB_DATABASE=.*/DB_DATABASE=timesovh_naqashthaheem/' .env
            sed -i 's/DB_USERNAME=.*/DB_USERNAME=timesovh_naqash_thaheem/' .env
            sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=mg08.Rcrld}N/' .env
            sed -i 's/APP_URL=.*/APP_URL=https:\/\/naqashthaheem.com/' .env
            sed -i 's/APP_ENV=.*/APP_ENV=production/' .env
            sed -i 's/APP_DEBUG=.*/APP_DEBUG=false/' .env
          fi
          
          php artisan key:generate --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          
          # Run migrations
          echo -e "${BLUE}🗄️ Running database migrations...${NC}"
          php artisan migrate --force
          
          # Set permissions
          echo -e "${BLUE}🔐 Setting permissions...${NC}"
          chmod -R 755 storage/
          chmod -R 755 bootstrap/cache/
          
          # Deploy frontend to public_html (inside naqashthaheem.com)
          echo -e "${BLUE}📁 Deploying frontend to public_html...${NC}"
          mkdir -p ~/naqashthaheem.com/public_html
          cp -r ../frontend/dist/* ~/naqashthaheem.com/public_html/
          
          # Deploy backend to api directory (inside naqashthaheem.com)
          echo -e "${BLUE}📁 Deploying backend to api directory...${NC}"
          mkdir -p ~/naqashthaheem.com/public_html/api
          cp -r . ~/naqashthaheem.com/public_html/api/
          
          # Set up .htaccess for API
          echo -e "${BLUE}⚙️ Setting up API routing...${NC}"
          echo "<IfModule mod_rewrite.c>" > ~/naqashthaheem.com/public_html/api/.htaccess
          echo "    RewriteEngine On" >> ~/naqashthaheem.com/public_html/api/.htaccess
          echo "    RewriteRule ^(.*)$ public/\$1 [L]" >> ~/naqashthaheem.com/public_html/api/.htaccess
          echo "</IfModule>" >> ~/naqashthaheem.com/public_html/api/.htaccess
          
          # Set up main .htaccess
          echo "<IfModule mod_rewrite.c>" > ~/naqashthaheem.com/public_html/.htaccess
          echo "    RewriteEngine On" >> ~/naqashthaheem.com/public_html/.htaccess
          echo "" >> ~/naqashthaheem.com/public_html/.htaccess
          echo "    # Handle API requests" >> ~/naqashthaheem.com/public_html/.htaccess
          echo "    RewriteCond %{REQUEST_URI} ^/api/(.*)$" >> ~/naqashthaheem.com/public_html/.htaccess
          echo "    RewriteRule ^api/(.*)$ api/public/\$1 [L]" >> ~/naqashthaheem.com/public_html/.htaccess
          echo "" >> ~/naqashthaheem.com/public_html/.htaccess
          echo "    # Handle frontend routes" >> ~/naqashthaheem.com/public_html/.htaccess
          echo "    RewriteCond %{REQUEST_FILENAME} !-f" >> ~/naqashthaheem.com/public_html/.htaccess
          echo "    RewriteCond %{REQUEST_FILENAME} !-d" >> ~/naqashthaheem.com/public_html/.htaccess
          echo "    RewriteRule . /index.html [L]" >> ~/naqashthaheem.com/public_html/.htaccess
          echo "</IfModule>" >> ~/naqashthaheem.com/public_html/.htaccess
          
          echo -e "${GREEN}✅ Deployment completed successfully!${NC}"
          echo -e "${BLUE}🌐 Your site is now live at: https://naqashthaheem.com${NC}"
          echo -e "${BLUE}🔧 API is available at: https://naqashthaheem.com/api${NC}"