name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Build frontend
      run: |
        cd frontend
        export VITE_API_URL=https://naqashthaheem.com/api
        export VITE_APP_NAME="Naqash Thaheem"
        export VITE_APP_ENV=production
        # Use production environment file if it exists
        if [ -f ".env.production" ]; then
          cp .env.production .env
        fi
        npm run build
        
    - name: Upload deployment script
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        port: 21098
        source: "scripts/deploy-production.sh"
        target: "/tmp"
    
    - name: Deploy to server
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        port: 21098
        timeout: 600s
        command_timeout: 600s
        script: |
          # Export environment variables
          export STABLE_APP_KEY="${{ secrets.STABLE_APP_KEY }}"
          export VAPID_PUBLIC_KEY="${{ secrets.VAPID_PUBLIC_KEY }}"
          export VAPID_PRIVATE_KEY="${{ secrets.VAPID_PRIVATE_KEY }}"
          export VAPID_SUBJECT="${{ secrets.VAPID_SUBJECT }}"
          export VITE_VAPID_PUBLIC_KEY="${{ secrets.VAPID_PUBLIC_KEY }}"
          
          # Make script executable and run it
          chmod +x /tmp/deploy-production.sh
          bash /tmp/deploy-production.sh
          # Colors for output
          RED='\033[0;31m'
          GREEN='\033[0;32m'
          YELLOW='\033[1;33m'
          BLUE='\033[0;34m'
          NC='\033[0m' # No Color
          
          echo -e "${BLUE}🚀 Starting Production Deployment${NC}"
          echo "=================================="
          
          # Create main directory structure
          mkdir -p ~/naqashthaheem.com
          cd ~/naqashthaheem.com
          
          # Clone or update repository
          if [ ! -d ".git" ]; then
            echo -e "${GREEN}📥 Cloning repository...${NC}"
            git clone https://github.com/naqash263/NovaWrite.git .
          else
            echo -e "${GREEN}🔄 Updating repository...${NC}"
            git fetch --all
            git reset --hard origin/main
          fi
          
          # Install Node.js using NVM (no sudo required)
          if ! command -v node &> /dev/null; then
            echo -e "${YELLOW}📦 Installing Node.js via NVM...${NC}"
            curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.0/install.sh | bash
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm install 20
            nvm use 20
            nvm alias default 20
          else
            echo -e "${GREEN}✅ Node.js already installed: $(node --version)${NC}"
            # Check if we need to upgrade to Node 20
            NODE_VERSION=$(node --version | cut -d'v' -f2 | cut -d'.' -f1)
            if [ "$NODE_VERSION" -lt 20 ]; then
              echo -e "${YELLOW}⚠️ Upgrading to Node.js 20 (current: $(node --version))${NC}"
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              nvm install 20
              nvm use 20
              nvm alias default 20
            fi
          fi
          
          # Ensure Node.js is available in current session
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          export PATH="$NVM_DIR/versions/node/$(nvm current)/bin:$PATH"
          
          # Fix npm configuration issues
          echo -e "${BLUE}🔧 Fixing npm configuration...${NC}"
          if [ -f "$HOME/.npmrc" ]; then
            echo -e "${YELLOW}⚠️ Removing conflicting .npmrc file${NC}"
            rm -f "$HOME/.npmrc"
          fi
          
          # Clean npm cache
          npm cache clean --force
          
          # Install frontend dependencies
          echo -e "${BLUE}📦 Installing frontend dependencies...${NC}"
          cd frontend
          
          # Verify Node.js is working
          if ! command -v node &> /dev/null; then
            echo -e "${RED}❌ Node.js not found after installation${NC}"
            exit 1
          fi
          
          echo -e "${GREEN}✅ Node.js version: $(node --version)${NC}"
          echo -e "${GREEN}✅ NPM version: $(npm --version)${NC}"
          
          # Clean install
          echo -e "${BLUE}🧹 Cleaning previous installation...${NC}"
          rm -rf node_modules package-lock.json
          
          # Clean any generated config files that might conflict
          echo -e "${BLUE}🧹 Cleaning generated config files...${NC}"
          rm -f vite.config.js
          rm -f tsconfig.tsbuildinfo
          rm -rf node_modules/.tmp
          
          # Clean any generated JavaScript files from TypeScript compilation
          echo -e "${BLUE}🧹 Cleaning generated JavaScript files...${NC}"
          find src -name "*.js" -type f -delete
          find . -name "*.js.map" -type f -delete
          
          npm install
          
          # Create production environment file
          echo -e "${BLUE}📝 Creating production environment file...${NC}"
          echo "VITE_API_URL=https://naqashthaheem.com/api" > .env
          echo "VITE_APP_URL=https://naqashthaheem.com" >> .env
          echo "VITE_APP_NAME=Naqash Thaheem" >> .env
          echo "VITE_APP_ENV=production" >> .env
          echo "VITE_VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}" >> .env
          
          # Build frontend
          echo -e "${BLUE}🔨 Building frontend...${NC}"
          export VITE_API_URL=https://naqashthaheem.com/api
          export VITE_APP_NAME="Naqash Thaheem"
          export VITE_APP_ENV=production
          export VITE_VAPID_PUBLIC_KEY="${{ secrets.VAPID_PUBLIC_KEY }}"
          
          # Debug: Check VAPID key is set
          echo -e "${BLUE}🔑 VAPID Public Key: ${VITE_VAPID_PUBLIC_KEY:0:20}...${NC}"
          
          # Show current directory and files
          echo -e "${BLUE}📁 Current directory: $(pwd)${NC}"
          echo -e "${BLUE}📁 Directory contents:${NC}"
          ls -la
          
          # Show package.json scripts
          echo -e "${BLUE}📋 Available npm scripts:${NC}"
          npm run --silent 2>/dev/null || echo "No scripts available"
          
          # Try to build with detailed output
          echo -e "${BLUE}🔨 Running TypeScript type checking...${NC}"
          if npx tsc --noEmit; then
            echo -e "${GREEN}✅ TypeScript type checking completed${NC}"
          else
            echo -e "${RED}❌ TypeScript type checking failed${NC}"
            exit 1
          fi
          
          # Clean up any files that might have been generated during type checking
          echo -e "${BLUE}🧹 Cleaning up after type checking...${NC}"
          find src -name "*.js" -type f -delete
          find . -name "*.js.map" -type f -delete
          rm -f tsconfig.tsbuildinfo
          
          echo -e "${BLUE}🔨 Running Vite build...${NC}"
          if npx vite build; then
            echo -e "${GREEN}✅ Vite build completed${NC}"
          else
            echo -e "${RED}❌ Vite build failed${NC}"
            echo -e "${BLUE}📁 Checking if dist directory exists...${NC}"
            ls -la dist/ 2>/dev/null || echo "dist directory does not exist"
            exit 1
          fi
          
          # Verify build was successful
          if [ ! -d "dist" ]; then
            echo -e "${RED}❌ Frontend build failed - dist directory not found${NC}"
            echo -e "${BLUE}📁 Current directory contents after build:${NC}"
            ls -la
            echo -e "${BLUE}📁 Looking for any build output directories:${NC}"
            find . -name "dist" -type d 2>/dev/null || echo "No dist directories found"
            find . -name "build" -type d 2>/dev/null || echo "No build directories found"
            exit 1
          fi
          
          echo -e "${GREEN}✅ Frontend build completed successfully${NC}"
          echo -e "${BLUE}📁 Dist directory contents:${NC}"
          ls -la dist/
          
          # Install backend dependencies
          echo -e "${BLUE}📦 Installing backend dependencies...${NC}"
          cd ../backend
          
          # Install Composer dependencies
          if ! command -v composer &> /dev/null; then
            echo -e "${YELLOW}📦 Installing Composer...${NC}"
            curl -sS https://getcomposer.org/installer | php
            mv composer.phar ~/composer
            chmod +x ~/composer
            export PATH="$HOME:$PATH"
          fi
          
          # Ensure Composer is available
          export PATH="$HOME:$PATH"
          
          composer install --no-dev --optimize-autoloader
          
          # Set up Laravel
          echo -e "${BLUE}⚙️ Setting up Laravel...${NC}"
          
          # Create .env file for Laravel
          if [ -f ".env.production" ]; then
            echo -e "${GREEN}✅ Using production environment file${NC}"
            cp .env.production .env
          else
            echo -e "${YELLOW}⚠️ Creating .env file for production${NC}"
            echo 'APP_NAME="Naqash Thaheem"' > .env
            echo 'APP_ENV=production' >> .env
            echo 'APP_KEY=' >> .env
            echo 'APP_DEBUG=false' >> .env
            echo 'APP_URL=https://naqashthaheem.com' >> .env
            echo '' >> .env
            echo 'LOG_CHANNEL=stack' >> .env
            echo 'LOG_DEPRECATIONS_CHANNEL=null' >> .env
            echo 'LOG_LEVEL=info' >> .env
            echo '' >> .env
            echo 'DB_CONNECTION=pgsql' >> .env
            echo 'DB_HOST=localhost' >> .env
            echo 'DB_PORT=5432' >> .env
            echo 'DB_DATABASE=timesovh_naqashthaheem' >> .env
            echo 'DB_USERNAME=timesovh_naqash_thaheem' >> .env
            echo 'DB_PASSWORD=mg08.Rcrld}N' >> .env
            echo '' >> .env
            echo 'BROADCAST_DRIVER=log' >> .env
            echo 'CACHE_DRIVER=file' >> .env
            echo 'FILESYSTEM_DISK=local' >> .env
            echo 'QUEUE_CONNECTION=database' >> .env
            echo 'SESSION_DRIVER=file' >> .env
            echo 'SESSION_LIFETIME=120' >> .env
            echo '' >> .env
            echo 'MEMCACHED_HOST=127.0.0.1' >> .env
            echo '' >> .env
            echo 'REDIS_HOST=127.0.0.1' >> .env
            echo 'REDIS_PASSWORD=null' >> .env
            echo 'REDIS_PORT=6379' >> .env
            echo '' >> .env
            echo 'MAIL_MAILER=log' >> .env
            echo 'MAIL_HOST=localhost' >> .env
            echo 'MAIL_PORT=1025' >> .env
            echo 'MAIL_USERNAME=null' >> .env
            echo 'MAIL_PASSWORD=null' >> .env
            echo 'MAIL_ENCRYPTION=null' >> .env
            echo 'MAIL_FROM_ADDRESS="contact@naqashthaheem.com"' >> .env
            echo 'MAIL_FROM_NAME="${APP_NAME}"' >> .env
            echo '' >> .env
            echo 'AWS_ACCESS_KEY_ID=' >> .env
            echo 'AWS_SECRET_ACCESS_KEY=' >> .env
            echo 'AWS_DEFAULT_REGION=us-east-1' >> .env
            echo 'AWS_BUCKET=' >> .env
            echo 'AWS_USE_PATH_STYLE_ENDPOINT=false' >> .env
            echo '' >> .env
            echo 'PUSHER_APP_ID=' >> .env
            echo 'PUSHER_APP_KEY=' >> .env
            echo 'PUSHER_APP_SECRET=' >> .env
            echo 'PUSHER_HOST=' >> .env
            echo 'PUSHER_PORT=443' >> .env
            echo 'PUSHER_SCHEME=https' >> .env
            echo 'PUSHER_APP_CLUSTER=mt1' >> .env
            echo '' >> .env
            echo 'VITE_APP_NAME="${APP_NAME}"' >> .env
            echo 'VITE_PUSHER_APP_KEY="${PUSHER_APP_KEY}"' >> .env
            echo 'VITE_PUSHER_HOST="${PUSHER_HOST}"' >> .env
            echo 'VITE_PUSHER_PORT="${PUSHER_PORT}"' >> .env
            echo 'VITE_PUSHER_SCHEME="${PUSHER_SCHEME}"' >> .env
            echo 'VITE_PUSHER_APP_CLUSTER="${PUSHER_APP_CLUSTER}"' >> .env
            echo '' >> .env
            echo 'JWT_SECRET=' >> .env
            echo 'JWT_ALGO=HS256' >> .env
            echo 'JWT_TTL=60' >> .env
            echo '' >> .env
            echo 'VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}' >> .env
            echo 'VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}' >> .env
            echo 'VAPID_SUBJECT=${{ secrets.VAPID_SUBJECT }}' >> .env
            echo '' >> .env
            echo 'GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}' >> .env
            echo 'GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}' >> .env
            echo 'GOOGLE_REDIRECT_URI=https://naqashthaheem.com/auth/google/callback' >> .env
          fi
          
          # Update Google OAuth credentials if .env exists
          echo -e "${BLUE}🔐 Configuring Google OAuth...${NC}"
          if ! grep -q "^GOOGLE_CLIENT_ID=" .env || grep -q "^GOOGLE_CLIENT_ID=$" .env; then
            sed -i '/^GOOGLE_CLIENT_ID=/d' .env
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
          else
            sed -i "s|^GOOGLE_CLIENT_ID=.*|GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}|" .env
          fi
          
          if ! grep -q "^GOOGLE_CLIENT_SECRET=" .env || grep -q "^GOOGLE_CLIENT_SECRET=$" .env; then
            sed -i '/^GOOGLE_CLIENT_SECRET=/d' .env
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
          else
            sed -i "s|^GOOGLE_CLIENT_SECRET=.*|GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}|" .env
          fi
          
          if ! grep -q "^GOOGLE_REDIRECT_URI=" .env || grep -q "^GOOGLE_REDIRECT_URI=$" .env; then
            sed -i '/^GOOGLE_REDIRECT_URI=/d' .env
            echo 'GOOGLE_REDIRECT_URI=https://naqashthaheem.com/auth/google/callback' >> .env
          else
            sed -i 's|^GOOGLE_REDIRECT_URI=.*|GOOGLE_REDIRECT_URI=https://naqashthaheem.com/auth/google/callback|' .env
          fi
          
          # Configure FRONTEND_URL for Google OAuth redirects
          echo -e "${BLUE}🌐 Configuring FRONTEND_URL...${NC}"
          if ! grep -q "^FRONTEND_URL=" .env; then
            echo 'FRONTEND_URL=https://naqashthaheem.com' >> .env
          else
            sed -i 's|^FRONTEND_URL=.*|FRONTEND_URL=https://naqashthaheem.com|' .env
          fi
          
          # Configure VAPID keys for push notifications
          echo -e "${BLUE}🔔 Configuring VAPID keys for push notifications...${NC}"
          if ! grep -q "^VAPID_PUBLIC_KEY=" .env || grep -q "^VAPID_PUBLIC_KEY=$" .env; then
            sed -i '/^VAPID_PUBLIC_KEY=/d' .env
            echo "VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}" >> .env
          else
            sed -i "s|^VAPID_PUBLIC_KEY=.*|VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}|" .env
          fi
          
          if ! grep -q "^VAPID_PRIVATE_KEY=" .env || grep -q "^VAPID_PRIVATE_KEY=$" .env; then
            sed -i '/^VAPID_PRIVATE_KEY=/d' .env
            echo "VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}" >> .env
          else
            sed -i "s|^VAPID_PRIVATE_KEY=.*|VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}|" .env
          fi
          
          if ! grep -q "^VAPID_SUBJECT=" .env || grep -q "^VAPID_SUBJECT=$" .env; then
            sed -i '/^VAPID_SUBJECT=/d' .env
            echo "VAPID_SUBJECT=${{ secrets.VAPID_SUBJECT }}" >> .env
          else
            sed -i "s|^VAPID_SUBJECT=.*|VAPID_SUBJECT=${{ secrets.VAPID_SUBJECT }}|" .env
          fi
          
              # Use stable APP_KEY from GitHub Secret
              echo -e "${BLUE}🔑 Setting stable APP_KEY from GitHub Secret...${NC}"
              if [ ! -z "${{ secrets.STABLE_APP_KEY }}" ]; then
                echo "APP_KEY=${{ secrets.STABLE_APP_KEY }}" >> .env
                echo -e "${GREEN}✅ APP_KEY restored from GitHub Secret: ${STABLE_APP_KEY:0:20}...${NC}"
              else
                echo -e "${YELLOW}⚠️ STABLE_APP_KEY secret not found, generating new key${NC}"
                php artisan key:generate --force
                # Backup the new key for future use
                NEW_KEY=$(grep '^APP_KEY=' .env | cut -d'=' -f2)
                echo -e "${BLUE}🔑 New APP_KEY generated: ${NEW_KEY:0:20}...${NC}"
                echo -e "${YELLOW}⚠️ Please add this key as STABLE_APP_KEY secret: $NEW_KEY${NC}"
              fi
              
              # Generate JWT secret
              echo -e "${BLUE}🔑 Generating JWT secret...${NC}"
              JWT_SECRET=$(openssl rand -base64 32)
              echo "JWT_SECRET=$JWT_SECRET" >> .env
              echo -e "${GREEN}✅ JWT secret generated and added to .env${NC}"
              
              php artisan config:cache
              php artisan route:cache
              php artisan view:cache
          
          # Ensure APP_URL is set correctly for storage URLs
          echo -e "${BLUE}🔧 Configuring APP_URL for production...${NC}"
          if ! grep -q "^APP_URL=https://naqashthaheem.com" .env; then
            sed -i 's|^APP_URL=.*|APP_URL=https://naqashthaheem.com|' .env
            echo -e "${GREEN}✅ APP_URL updated to https://naqashthaheem.com${NC}"
            # Clear config cache to pick up new APP_URL
            php artisan config:clear
          fi
          
          # Grant database permissions and run migrations
          echo -e "${BLUE}🗄️ Setting up database permissions and running migrations...${NC}"
          
          # Grant necessary permissions to database user
          echo -e "${BLUE}🔐 Granting database permissions...${NC}"
          PGPASSWORD='mg08.Rcrld}N' psql -h localhost -U timesovh_naqash_thaheem -d timesovh_naqashthaheem -c "
            -- Grant all privileges on existing tables
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO timesovh_naqash_thaheem;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO timesovh_naqash_thaheem;
            GRANT ALL PRIVILEGES ON ALL FUNCTIONS IN SCHEMA public TO timesovh_naqash_thaheem;
            
            -- Grant privileges on schema
            GRANT USAGE ON SCHEMA public TO timesovh_naqash_thaheem;
            GRANT CREATE ON SCHEMA public TO timesovh_naqash_thaheem;
            
            -- Set default privileges for future objects
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO timesovh_naqash_thaheem;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO timesovh_naqash_thaheem;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON FUNCTIONS TO timesovh_naqash_thaheem;
          " || echo -e "${YELLOW}⚠️ Permission grant completed (some warnings are normal)${NC}"
          
          # APP_KEY is now managed via GitHub Secrets (set above)
          echo -e "${GREEN}✅ APP_KEY managed via GitHub Secrets${NC}"
          
          # Backup current encryption key (from GitHub Secret) before running migrations
          echo -e "${BLUE}🔑 Backing up current encryption key...${NC}"
          CURRENT_KEY="${{ secrets.STABLE_APP_KEY }}"
          if [ ! -z "$CURRENT_KEY" ] && [ "$CURRENT_KEY" != "" ]; then
            PGPASSWORD='mg08.Rcrld}N' psql -h localhost -U timesovh_naqash_thaheem -d timesovh_naqashthaheem -c "
              INSERT INTO encryption_key_backups (environment, key, backed_up_at, created_at, updated_at) 
              VALUES ('production', '$CURRENT_KEY', NOW(), NOW(), NOW())
              ON CONFLICT (environment) DO UPDATE SET 
                key = '$CURRENT_KEY', 
                backed_up_at = NOW(), 
                updated_at = NOW();
            " || echo -e "${YELLOW}⚠️ Encryption key backup table may not exist yet${NC}"
            echo -e "${GREEN}✅ Current encryption key backed up${NC}"
          else
            echo -e "${YELLOW}⚠️ No STABLE_APP_KEY secret found to backup${NC}"
          fi
          
          # Run migrations with enhanced error handling
          echo -e "${BLUE}🗄️ Running database migrations...${NC}"
          if php artisan migrate --force; then
            echo -e "${GREEN}✅ Database migrations completed successfully${NC}"
          else
            echo -e "${RED}❌ Database migrations failed${NC}"
            echo -e "${BLUE}🔍 Checking migration status...${NC}"
            php artisan migrate:status
            echo -e "${BLUE}🔧 Attempting to fix migration issues...${NC}"
            
            # Try to run specific migrations that might have failed
            php artisan migrate:rollback --step=1 --force || echo -e "${YELLOW}⚠️ Rollback failed, continuing...${NC}"
            php artisan migrate --force || echo -e "${YELLOW}⚠️ Migration retry failed${NC}"
          fi
          
          # Create storage symlink
          echo -e "${BLUE}🔗 Creating storage symlink...${NC}"
          php artisan storage:link || echo -e "${YELLOW}⚠️ Symlink may already exist${NC}"
          
          # Create symlink in public_html/api/public for Laravel
          cd ~/naqashthaheem.com/public_html/api/public
          if [ ! -L "storage" ]; then
            ln -sf ../../../backend/storage/app/public storage
            echo -e "${GREEN}✅ Storage symlink created in api/public${NC}"
          else
            echo -e "${GREEN}✅ Storage symlink already exists in api/public${NC}"
          fi
          
          # Create symlink in public_html for direct access
          cd ~/naqashthaheem.com/public_html
          if [ ! -L "storage" ]; then
            ln -sf ../backend/storage/app/public storage
            echo -e "${GREEN}✅ Storage symlink created in public_html${NC}"
          else
            echo -e "${GREEN}✅ Storage symlink already exists in public_html${NC}"
          fi
          
          # Back to backend directory
          cd ~/naqashthaheem.com/backend
          
          # Set permissions
          echo -e "${BLUE}🔐 Setting permissions...${NC}"
          chmod -R 775 storage/
          chmod -R 775 bootstrap/cache/
          
          # Deploy frontend to public_html (inside naqashthaheem.com)
          echo -e "${BLUE}📁 Deploying frontend to public_html...${NC}"
          mkdir -p ~/naqashthaheem.com/public_html
          cp -r ../frontend/dist/* ~/naqashthaheem.com/public_html/
          
          # Deploy backend to api directory (inside naqashthaheem.com)
          echo -e "${BLUE}📁 Deploying backend to api directory...${NC}"
          mkdir -p ~/naqashthaheem.com/public_html/api
          cp -r . ~/naqashthaheem.com/public_html/api/
          
          # Set up .htaccess for API
          echo -e "${BLUE}⚙️ Setting up API routing...${NC}"
          echo "<IfModule mod_rewrite.c>" > ~/naqashthaheem.com/public_html/api/.htaccess
          echo "    RewriteEngine On" >> ~/naqashthaheem.com/public_html/api/.htaccess
          echo "    RewriteRule ^(.*)$ public/\$1 [L]" >> ~/naqashthaheem.com/public_html/api/.htaccess
          echo "</IfModule>" >> ~/naqashthaheem.com/public_html/api/.htaccess
          
          # Set up main .htaccess
          echo "<IfModule mod_rewrite.c>" > ~/naqashthaheem.com/public_html/.htaccess
          echo "    RewriteEngine On" >> ~/naqashthaheem.com/public_html/.htaccess
          echo "" >> ~/naqashthaheem.com/public_html/.htaccess
          echo "    # Handle sitemap requests - route to backend API" >> ~/naqashthaheem.com/public_html/.htaccess
          echo "    RewriteCond %{REQUEST_URI} ^/sitemap-ntw2024\.xml$ [NC]" >> ~/naqashthaheem.com/public_html/.htaccess
          echo "    RewriteRule ^sitemap-ntw2024\.xml$ /api/sitemap-ntw2024.xml [L]" >> ~/naqashthaheem.com/public_html/.htaccess
          echo "" >> ~/naqashthaheem.com/public_html/.htaccess
          echo "    # Handle API requests" >> ~/naqashthaheem.com/public_html/.htaccess
          echo "    RewriteCond %{REQUEST_URI} ^/api/(.*)$" >> ~/naqashthaheem.com/public_html/.htaccess
