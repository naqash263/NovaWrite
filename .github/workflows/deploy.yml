name: Deploy to Namecheap

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, dom, fileinfo, mysql, pgsql
        coverage: none
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install PHP dependencies
      run: |
        cd backend
        composer install --no-dev --optimize-autoloader
        
    - name: Install Node dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Build frontend
      run: |
        cd frontend
        npm run build
        
    - name: Deploy to Namecheap
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.HOST }}                 # serverNNN.web-hosting.com (or shared IP)
        username: ${{ secrets.USERNAME }}         # cPanel username
        key: ${{ secrets.SSH_KEY }}               # private key
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        port: 21098
        timeout: 90s
        script: |
          echo "🚀 Starting deployment to Namecheap..."
          
          # Create app directory if it doesn't exist
          mkdir -p /naqashthaheem.com
          cd /naqashthaheem.com
          
          # Clone or update repository
          if [ -d ".git" ]; then
            echo "📥 Updating existing repository..."
            git fetch --all
            git reset --hard origin/main
          else
            echo "📥 Cloning repository for first time..."
            git clone https://github.com/naqash263/NovaWrite.git .
          fi
          
          # Run deployment script
          echo "🔧 Running deployment script..."
          chmod +x cpanel-deploy.sh
          ./cpanel-deploy.sh
          
          echo "✅ Deployment completed successfully!"
