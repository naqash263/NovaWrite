name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Build frontend
      run: |
        cd frontend
        export VITE_API_URL=https://naqashthaheem.com/api
        export VITE_APP_NAME="Naqash Thaheem"
        export VITE_APP_ENV=production
        # Use production environment file if it exists
        if [ -f ".env.production" ]; then
          cp .env.production .env
        fi
        npm run build
        
    - name: Deploy to server
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        port: 21098
        timeout: 300s
        command_timeout: 300s
        script: |
          # Colors for output
          RED='\033[0;31m'
          GREEN='\033[0;32m'
          YELLOW='\033[1;33m'
          BLUE='\033[0;34m'
          NC='\033[0m' # No Color
          
          echo -e "${BLUE}🚀 Starting Production Deployment${NC}"
          echo "=================================="
          
          # Create main directory structure
          mkdir -p ~/naqashthaheem.com
          cd ~/naqashthaheem.com
          
          # Clone or update repository
          if [ ! -d ".git" ]; then
            echo -e "${GREEN}📥 Cloning repository...${NC}"
            git clone https://github.com/naqash263/NovaWrite.git .
          else
            echo -e "${GREEN}🔄 Updating repository...${NC}"
            git fetch --all
            git reset --hard origin/main
          fi
          
          # Install Node.js if not present
          if ! command -v node &> /dev/null; then
            echo -e "${YELLOW}📦 Installing Node.js...${NC}"
            curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
            sudo apt-get install -y nodejs
          else
            echo -e "${GREEN}✅ Node.js already installed${NC}"
          fi
          
          # Install frontend dependencies
          echo -e "${BLUE}📦 Installing frontend dependencies...${NC}"
          cd frontend
          npm ci --production=false
          
          # Build frontend
          echo -e "${BLUE}🔨 Building frontend...${NC}"
          export VITE_API_URL=https://naqashthaheem.com/api
          export VITE_APP_NAME="Naqash Thaheem"
          export VITE_APP_ENV=production
          
          if [ -f ".env.production" ]; then
            echo -e "${GREEN}✅ Using production environment file${NC}"
            cp .env.production .env
          fi
          
          npm run build
          
          # Install backend dependencies
          echo -e "${BLUE}📦 Installing backend dependencies...${NC}"
          cd ../backend
          
          # Install Composer dependencies
          if ! command -v composer &> /dev/null; then
            echo -e "${YELLOW}📦 Installing Composer...${NC}"
            curl -sS https://getcomposer.org/installer | php
            sudo mv composer.phar /usr/local/bin/composer
          fi
          
          composer install --no-dev --optimize-autoloader
          
          # Set up Laravel
          echo -e "${BLUE}⚙️ Setting up Laravel...${NC}"
          cp .env.production .env
          php artisan key:generate --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          
          # Run migrations
          echo -e "${BLUE}🗄️ Running database migrations...${NC}"
          php artisan migrate --force
          
          # Set permissions
          echo -e "${BLUE}🔐 Setting permissions...${NC}"
          chmod -R 755 storage/
          chmod -R 755 bootstrap/cache/
          
          # Deploy frontend to public_html
          echo -e "${BLUE}📁 Deploying frontend to public_html...${NC}"
          mkdir -p ~/public_html
          cp -r ../frontend/dist/* ~/public_html/
          
          # Deploy backend to api directory
          echo -e "${BLUE}📁 Deploying backend to api directory...${NC}"
          mkdir -p ~/public_html/api
          cp -r . ~/public_html/api/
          
          # Set up .htaccess for API
          echo -e "${BLUE}⚙️ Setting up API routing...${NC}"
          cat > ~/public_html/api/.htaccess << 'EOF'
          <IfModule mod_rewrite.c>
              RewriteEngine On
              RewriteRule ^(.*)$ public/$1 [L]
          </IfModule>
          EOF
          
          # Set up main .htaccess
          cat > ~/public_html/.htaccess << 'EOF'
          <IfModule mod_rewrite.c>
              RewriteEngine On
              
              # Handle API requests
              RewriteCond %{REQUEST_URI} ^/api/(.*)$
              RewriteRule ^api/(.*)$ api/public/$1 [L]
              
              # Handle frontend routes
              RewriteCond %{REQUEST_FILENAME} !-f
              RewriteCond %{REQUEST_FILENAME} !-d
              RewriteRule . /index.html [L]
          </IfModule>
          EOF
          
          echo -e "${GREEN}✅ Deployment completed successfully!${NC}"
          echo -e "${BLUE}🌐 Your site is now live at: https://naqashthaheem.com${NC}"
          echo -e "${BLUE}🔧 API is available at: https://naqashthaheem.com/api${NC}"