name: Run System Email Migration

on:
  workflow_dispatch:

jobs:
  run-migration:
    runs-on: ubuntu-latest

    steps:
    - name: Run System Email Migration
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        port: 21098
        timeout: 300s
        command_timeout: 300s
        script: |
          # Colors for output
          RED='\033[0;31m'
          GREEN='\033[0;32m'
          BLUE='\033[0;34m'
          YELLOW='\033[1;33m'
          NC='\033[0m' # No Color

          echo -e "${BLUE}🗄️ Running System Email Migration${NC}"
          echo "====================================="

          # Navigate to project directory
          cd ~/naqashthaheem.com/backend

          # Load environment variables
          if [ -f ".env" ]; then
            export $(grep -v '^#' .env | xargs)
          fi

          echo -e "${YELLOW}📋 Checking current migration status...${NC}"
          php artisan migrate:status

          echo -e "${YELLOW}🔧 Manually marking password reset migration as completed...${NC}"
          PGPASSWORD='mg08.Rcrld}N' psql -h localhost -U timesovh_naqash_thaheem -d timesovh_naqashthaheem -c "
            INSERT INTO migrations (migration, batch) 
            VALUES ('2025_10_24_132508_add_password_reset_columns_to_users_table', 18);
          "

          echo -e "${YELLOW}🗄️ Running system email settings migration...${NC}"
          php artisan migrate --path=database/migrations/2025_10_24_185409_create_system_email_settings_table.php --force

          echo -e "${YELLOW}📊 Final migration status...${NC}"
          php artisan migrate:status

          echo -e "${GREEN}✅ System email migration completed!${NC}"
