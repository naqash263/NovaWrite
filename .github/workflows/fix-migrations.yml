name: Fix Migrations

on:
  workflow_dispatch:

jobs:
  fix-migrations:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Fix Migrations
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        port: 21098
        timeout: 300s
        command_timeout: 300s
        script: |
          # Colors for output
          RED='\033[0;31m'
          GREEN='\033[0;32m'
          YELLOW='\033[1;33m'
          BLUE='\033[0;34m'
          NC='\033[0m' # No Color
          
          echo -e "${BLUE}🔧 Fixing Migration Issues${NC}"
          echo "=============================================="
          
          # Navigate to project directory
          cd ~/naqashthaheem.com/backend
          
          # Load environment variables
          if [ -f ".env" ]; then
            export $(grep -v '^#' .env | xargs)
          fi
          
          echo -e "${BLUE}🔍 Checking current migration status...${NC}"
          php artisan migrate:status | grep -E "(2025_10_24|2025_10_25)"
          
          echo -e "${BLUE}🔧 Manually marking password reset migration as completed...${NC}"
          PGPASSWORD='mg08.Rcrld}N' psql -h localhost -U timesovh_naqash_thaheem -d timesovh_naqashthaheem -c "
            INSERT INTO migrations (migration, batch) 
            VALUES ('2025_10_24_132508_add_password_reset_columns_to_users_table', 18)
            ON CONFLICT (migration) DO NOTHING;
          "
          
          echo -e "${GREEN}✅ Password reset migration marked as completed${NC}"
          
          echo -e "${BLUE}🗄️ Running remaining migrations...${NC}"
          php artisan migrate --force
          
          echo -e "${BLUE}🔍 Checking final migration status...${NC}"
          php artisan migrate:status | grep -E "(2025_10_24|2025_10_25)"
          
          echo -e "${GREEN}✅ Migration fix completed${NC}"
