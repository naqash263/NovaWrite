name: Check Password Reset Queue Status

on:
  workflow_dispatch:

jobs:
  check-queue:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check Password Reset Queue Status
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        port: 21098
        timeout: 300s
        script: |
          # Colors for output
          BLUE='\033[0;34m'
          GREEN='\033[0;32m'
          YELLOW='\033[1;33m'
          RED='\033[0;31m'
          NC='\033[0m'
          
          echo -e "${BLUE}🔍 Checking Password Reset Queue Status${NC}"
          echo "============================================"
          
          cd ~/naqashthaheem.com/backend
          
          # Check if queue worker is running
          echo -e "${BLUE}1. Checking queue worker status...${NC}"
          if ps aux | grep "[q]ueue:work" > /dev/null; then
            echo -e "${GREEN}✅ Queue worker is running${NC}"
            ps aux | grep "[q]ueue:work" | head -1
          else
            echo -e "${RED}❌ Queue worker is NOT running${NC}"
          fi
          
          echo ""
          
          # Check email queue
          echo -e "${BLUE}2. Checking password reset emails in queue...${NC}"
          php artisan tinker --execute="
            \$recent = \DB::table('email_queue')->where('action', 'password_reset')->orderBy('created_at', 'desc')->limit(5)->get(['action', 'recipient_email', 'status', 'created_at', 'attempts']);
            if (\$recent->count() > 0) {
              foreach (\$recent as \$email) {
                echo \$email->action . ' | ' . \$email->recipient_email . ' | ' . \$email->status . ' | ' . \$email->created_at . ' | Attempts: ' . \$email->attempts . PHP_EOL;
              }
            } else {
              echo 'No password reset emails in queue' . PHP_EOL;
            }
          "
          
          echo ""
          
          # Check email logs
          echo -e "${BLUE}3. Checking password reset email logs...${NC}"
          php artisan tinker --execute="
            \$logs = \DB::table('email_logs')->where('action', 'password_reset')->orderBy('created_at', 'desc')->limit(5)->get(['action', 'recipient_email', 'status', 'created_at']);
            if (\$logs->count() > 0) {
              foreach (\$logs as \$log) {
                echo \$log->action . ' | ' . \$log->recipient_email . ' | ' . \$log->status . ' | ' . \$log->created_at . PHP_EOL;
              }
            } else {
              echo 'No password reset logs found' . PHP_EOL;
            }
          "
          
          echo ""
          echo -e "${GREEN}✅ Check completed!${NC}"

